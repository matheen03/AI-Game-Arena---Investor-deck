<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Outer Star -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4e9b"/>
      <stop offset="50%" stop-color="#0c5cb7"/>
      <stop offset="100%" stop-color="#073a74"/>
    </linearGradient>
    <!-- Inner Globe Gradient -->
    <radialGradient id="oceanGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1ea5e9"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Text Paths for Curving Words -->
    <!-- Top Arc for Arabic -->
    <path id="topTextArc" d="M 68,200 A 132,132 0 0,1 332,200" fill="none" />
    <!-- Bottom Arc for English: Al-Rowad International Schools -->
    <path id="bottomTextArc" d="M 72,200 A 128,128 0 0,0 328,200" fill="none" />
  </defs>

  <!-- 8-POINTED STAR (OCTAGRAM: Two rotated overlapping squares) -->
  <g transform="translate(200, 200)">
    <!-- Square 1 (0 deg) -->
    <rect x="-185" y="-185" width="370" height="370" rx="14" fill="url(#starGradient)" stroke="#ffffff" stroke-width="4"/>
    <!-- Square 2 (45 deg) -->
    <rect x="-185" y="-185" width="370" height="370" rx="14" fill="url(#starGradient)" stroke="#ffffff" stroke-width="4" transform="rotate(45)"/>
    
    <!-- Inner White Geometric Inset Line -->
    <rect x="-165" y="-165" width="330" height="330" rx="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95"/>
    <rect x="-165" y="-165" width="330" height="330" rx="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95" transform="rotate(45)"/>
  </g>

  <!-- Circular Outer Frame for School Name -->
  <circle cx="200" cy="200" r="148" fill="#094588" stroke="#ffffff" stroke-width="3.5" />
  <circle cx="200" cy="200" r="114" fill="#ffffff" stroke="#0369a1" stroke-width="2" />

  <!-- GLOBE IN THE CENTER -->
  <circle cx="200" cy="200" r="110" fill="url(#oceanGrad)" />

  <!-- Latitude / Longitude Curvature Lines -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="1.2" fill="none">
    <ellipse cx="200" cy="200" rx="110" ry="40" />
    <ellipse cx="200" cy="200" rx="110" ry="78" />
    <ellipse cx="200" cy="200" rx="42" ry="110" />
    <ellipse cx="200" cy="200" rx="82" ry="110" />
    <line x1="90" y1="200" x2="310" y2="200" />
    <line x1="200" y1="90" x2="200" y2="310" />
  </g>

  <!-- CONTINENTS SILHOUETTES -->
  <g fill="url(#landGrad)" stroke="#b45309" stroke-width="1" opacity="0.95">
    <!-- Africa -->
    <path d="M 172,165 C 185,160 210,165 218,178 C 214,195 230,210 226,230 C 220,248 206,275 195,278 C 188,272 182,250 178,240 C 165,232 150,215 152,198 C 155,185 162,170 172,165 Z" />
    <!-- Arabian Peninsula (Saudi Arabia in focus) -->
    <path d="M 224,168 C 235,165 248,172 254,185 C 252,198 244,208 235,210 C 226,204 220,188 224,168 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <!-- Europe -->
    <path d="M 170,138 C 182,132 205,135 218,145 C 210,155 195,162 178,160 C 168,155 164,144 170,138 Z" />
    <!-- Asia -->
    <path d="M 224,135 C 245,128 275,135 292,158 C 290,178 274,195 258,190 C 248,180 238,155 224,135 Z" />
  </g>

  <!-- Glow and Ring Highlight -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />

  <!-- SCHOOL NAME TEXT ON CIRCLE -->
  <text fill="#ffffff" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="900" font-size="21.5" letter-spacing="1.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      مدارس الرواد العالمية
    </textPath>
  </text>
  <text fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="1">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      Al-Rowad International Schools
    </textPath>
  </text>
  <!-- Star Embellishments -->
  <circle cx="85" cy="200" r="4" fill="#fef08a" />
  <circle cx="315" cy="200" r="4" fill="#fef08a" />
</svg>
